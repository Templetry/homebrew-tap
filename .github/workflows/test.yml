name: Test formula

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: what breaks here is usually upstream — an asset withdrawn, a
    # Homebrew change — not a commit in this repository.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: brew install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Homebrew ships with the macOS image but not with the Linux one, and
      # Linux is half of what this formula claims to support.
      # Pinned to a commit: the `master` ref vanished when upstream moved to
      # `main`, which took this job down with it.
      - uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04

      - name: Link this checkout in as the tap
        # Not `brew tap`: the name already resolves to the published repo, so
        # tapping a path is refused as a remote mismatch. Linking the working
        # copy into Homebrew's tap directory means a pull request tests the
        # formula in the pull request, not the one already on main.
        run: |
          tap_dir="$(brew --repository)/Library/Taps/templetry/homebrew-tap"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap

      - name: Audit
        # By name, not by path: `brew audit <path>` is disabled.
        run: brew audit --formula Templetry/tap/templetry

      - name: Install
        run: brew install Templetry/tap/templetry

      - name: The formula's own test — renders a template and checks the output
        run: brew test Templetry/tap/templetry

      - name: Both binaries are on PATH
        run: |
          templetry version
          command -v templetry-mcp
