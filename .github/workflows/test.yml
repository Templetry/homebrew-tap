name: Test formula

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: what breaks here is usually upstream — an asset withdrawn, a
    # Homebrew change — not a commit in this repository.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: brew install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Homebrew ships with the macOS image but not with the Linux one, and
      # Linux is half of what this formula claims to support.
      - uses: Homebrew/actions/setup-homebrew@master

      - name: Tap this checkout
        # Tapping the working copy rather than the published repo, so a pull
        # request tests the formula in the pull request.
        run: brew tap Templetry/tap "$GITHUB_WORKSPACE"

      - name: Audit
        # By name, not by path: `brew audit <path>` is disabled.
        run: brew audit --formula Templetry/tap/templetry

      - name: Install
        run: brew install Templetry/tap/templetry

      - name: The formula's own test — renders a template and checks the output
        run: brew test Templetry/tap/templetry

      - name: Both binaries are on PATH
        run: |
          templetry version
          command -v templetry-mcp
